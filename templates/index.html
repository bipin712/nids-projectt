<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SparkleClean — Professional Cleaning</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/dashboard.js" defer></script>
</head>
<body class="landing-page">
    <nav class="navbar">
        <div class="navbar-brand">🛡️NIDS Security System</div>
        <ul class="navbar-menu">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/alerts">Live Alerts</a></li>
            <li><a href="/analysis">Analysis</a></li>
            <li><a href="/ml_status">ML Status</a></li>
            <li><a href="/logs">Logs</a></li>
            <li><a href="/settings">Settings</a></li>
        </ul>
    </nav>


    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="h1">Dashboard</h1>
            </div>

            <div class="card-container">
                <div class="card">
                    <div class="label">Total Alerts</div>
                    <div class="stat-value" id="dash-total">--</div>
                </div>
                <div class="card">
                    <div class="label">High Severity</div>
                    <div class="stat-value" id="dash-high">--</div>
                </div>
                <div class="card">
                    <div class="label">Medium Severity</div>
                    <div class="stat-value" id="dash-medium">--</div>
                </div>
                <div class="card">
                    <div class="label">Low Severity</div>
                    <div class="stat-value" id="dash-low">--</div>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Quick Actions</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <a class="back-link" href="/alerts">View Live Alerts</a>
                            </td>
                            <td id="dash-ml-status">Loading…</td>
                        </tr>
                        <tr>
                            <td>
                                <a class="back-link" href="/analysis">Open Security Analysis</a>
                            </td>
                            <td id="dash-sniffer-status">Loading…</td>
                        </tr>
                        <tr>
                            <td>
                                <a class="back-link" href="/logs">Open Alert Logs</a>
                            </td>
                            <td id="dash-db-status">Loading…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function loadDashboard() {
            // Alerts stats
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    var s = data.alert_stats || {};
                    document.getElementById('dash-total').textContent = s.total ?? '--';
                    document.getElementById('dash-high').textContent = s.high ?? '--';
                    document.getElementById('dash-medium').textContent = s.medium ?? '--';
                    document.getElementById('dash-low').textContent = s.low ?? '--';

                    var sniffer = data.sniffer_stats || {};
                    document.getElementById('dash-sniffer-status').textContent = sniffer.is_running ? 'Running' : 'Stopped';

                    // Best-effort DB size/status from stats payload (if backend provides it)
                    document.getElementById('dash-db-status').textContent = data.db_stats ? ('Size: ' + (data.db_stats.size ?? '--')) : 'Ready';
                })
                .catch(() => {
                    document.getElementById('dash-total').textContent = '--';
                    document.getElementById('dash-high').textContent = '--';
                    document.getElementById('dash-medium').textContent = '--';
                    document.getElementById('dash-low').textContent = '--';
                });

            // ML status
            fetch('/api/ml-status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('dash-ml-status').textContent = data.ml_ready ? 'ML Active' : 'ML Offline';
                })
                .catch(() => {
                    document.getElementById('dash-ml-status').textContent = 'Unknown';
                });
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
